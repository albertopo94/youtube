name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-check:
    name: Contract checker fixtures
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run contract checker fixtures
        run: bash _framework/scripts/test-check-contrato.sh

      - name: Run contract checker against repository
        run: bash _framework/scripts/check-contrato.sh .
